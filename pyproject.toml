[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "renamethis"
version = "2.0.0.dev0"
description = "Renomeador de arquivos em lote seguro, com prévia, regras combináveis e desfazer."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "CleitinhoDEV" }]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "platformdirs>=3.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: X11 Applications :: Qt",
    "Topic :: Utilities",
]

[project.optional-dependencies]
# Leitura de metadados: data EXIF de fotos (Pillow) e tags de música (mutagen)
media = ["Pillow>=10.0", "mutagen>=1.47"]
dev = ["pytest>=8.0", "ruff>=0.5", "Pillow>=10.0", "mutagen>=1.47"]
build = ["pyinstaller>=6.0"]

[project.scripts]
renamethis-cli = "renamethis.cli:main"

[project.gui-scripts]
renamethis = "renamethis.gui.app:main"

[project.urls]
Homepage = "https://github.com/cleitinhodev/RenameThis"

[tool.setuptools.packages.find]
include = ["renamethis*"]

[tool.setuptools.package-data]
"renamethis.i18n" = ["*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM102", "SIM105", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
